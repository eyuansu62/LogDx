[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logdx-ci"
version = "0.3.0"
description = "Evaluation harness for log reduction tools targeting LLM root-cause diagnosis on CI failures."
readme = "logdx_ci/README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Bowen Qin", email = "noreply@logdx-bench.github.io" }]
keywords = ["benchmark", "llm", "ci", "log-reduction", "evaluation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai    = ["openai>=1.50"]
all       = ["anthropic>=0.40", "openai>=1.50"]

[project.urls]
Homepage      = "https://logdx-bench.github.io/"
Repository    = "https://github.com/eyuansu62/LogDx"
arXiv         = "https://arxiv.org/abs/2605.28876"
Dataset       = "https://huggingface.co/datasets/eyuansu71/logdx-ci"

[project.scripts]
logdx-ci = "logdx_ci.cli:main"

[tool.setuptools]
packages = ["logdx_ci"]
include-package-data = true

[tool.setuptools.package-data]
logdx_ci = ["data/*.json", "README.md"]
